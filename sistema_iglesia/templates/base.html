<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>{% block titulo %}Sistema Iglesia{% endblock %}</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; color: #222; }
    header { background: #1F4E79; color: #fff; padding: 12px 20px; }
    header span.titulo { font-weight: bold; font-size: 18px; }
    header span.usuario { float: right; }
    nav { background: #EAF2FF; padding: 10px 20px; }
    nav a { margin-right: 15px; color: #1F4E79; text-decoration: none; }
    main { padding: 20px; }
    table { border-collapse: collapse; width: 100%; }
    th, td { border: 1px solid #999; padding: 8px; text-align: left; }
    th { background: #1F4E79; color: #fff; }
    .badge { padding: 2px 8px; border-radius: 8px; color: #fff; font-size: 12px; }
    .activo { background: #2E7D32; } .inactivo { background: #999; } .visitante { background: #1565C0; }
    .messages { list-style: none; padding: 0; }
    .messages li { padding: 8px; margin-bottom: 8px; }
    .success { background: #E8F5E9; border: 1px solid #2E7D32; }
    .error { background: #FFEBEE; border: 1px solid #C62828; }
    .boton { background: #1F4E79; color: #fff; padding: 8px 16px; border: none; cursor: pointer; text-decoration: none; display: inline-block; }
    .cancelar { background: #777; color: #fff; padding: 8px 16px; text-decoration: none; display: inline-block; }
    form p { margin-bottom: 12px; }
    label { display: block; font-weight: bold; }
    .errorlist { color: #C62828; }
  </style>
</head>
<body>
  <header>
    <span class="titulo">Sistema de Gestión - Iglesia Local</span>
    <span class="usuario">Usuario &#9662;</span>
  </header>
  <nav>
    <a href="/">Dashboard</a>
    <a href="{% url 'miembros:lista' %}">Miembros</a>
    <a href="/admin/">Administración</a>
  </nav>
  <main>
    {% if messages %}
    <ul class="messages">
      {% for message in messages %}
      <li class="{{ message.tags }}">{{ message }}</li>
      {% endfor %}
    </ul>
    {% endif %}
    {% block contenido %}{% endblock %}
  </main>
</body>
</html>
